<svg xmlns="http://www.w3.org/2000/svg" width="410" height="370" viewBox="0 0 410 370" role="img" aria-labelledby="title desc">
  <title id="title">Panelia icon logo</title>
  <desc id="desc">Four rounded colored tiles with a check mark over the lower-right tile.</desc>
  <defs>
    <clipPath id="greenTileClip">
      <rect x="186" y="196" width="156" height="154" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- App tiles -->
  <rect x="10" y="21" width="156" height="154" rx="28" ry="28" fill="#4A97F2"/>
  <rect x="186" y="21" width="156" height="154" rx="28" ry="28" fill="#FFC421"/>
  <rect x="10" y="196" width="156" height="154" rx="28" ry="28" fill="#FB4079"/>
  <rect x="186" y="196" width="156" height="154" rx="28" ry="28" fill="#2FCC9A"/>

  <!-- Green continuation of the check outside the tile -->
  <path d="M 244 285 L 270 328 C 296 276 333 223 386 187 L 399 233 C 342 258 304 301 268 347 Z" fill="#16D19B"/>

  <!-- White part of the check, clipped to the green tile -->
  <g clip-path="url(#greenTileClip)">
    <path d="M 225 281 L 257 307 L 339 202 L 339 247 L 268 347 L 222 296 Z" fill="#FFFFFF"/>
  </g>
</svg>
